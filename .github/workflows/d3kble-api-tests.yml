name: d3kble API tests

on:
  pull_request:
    paths:
      - "d3kble-api/**"
      - "manual_tests/**"
      - ".github/workflows/d3kble-api-tests.yml"
  push:
    branches: [main]
    paths:
      - "d3kble-api/**"
      - ".github/workflows/d3kble-api-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: d3kble-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m compileall -q ../manual_tests
